services:
  bots:
    network_mode: "host"
    build: .
    volumes:
      - ./settings.js:/app/settings.js:ro
      - ./alice.json:/app/alice.json:ro
      - ./andy.json:/app/andy.json:ro
      - ./keys.json:/app/keys.json:ro
      - ./profiles:/app/profiles:ro
      - ./bots:/app/bots
      - ./schematics:/app/schematics:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  viaproxy: #use this service to connect to an unsupported minecraft server versions. more info: ./services/viaproxy/README.md
    image: ghcr.io/viaversion/viaproxy:latest
    volumes:
      - ./services/viaproxy:/app/run
    ports:
      - "25568:25568"
    profiles:
      - viaproxy
    stdin_open: true
    tty: true
